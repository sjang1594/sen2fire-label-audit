[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sen2fire-audit"
version = "0.1.0"
description = "Model-free audit of the Sen2Fire wildfire segmentation benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "h5py",
  "torch",
  "torchvision",
  "pyyaml",
]

[project.optional-dependencies]
segformer = ["transformers"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sen2fire_audit.data" = ["tables/*.csv"]
"sen2fire_audit.configs" = ["*.yaml"]
